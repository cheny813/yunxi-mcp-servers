server:
  port: 40107

spring:
  application:
    name: mcp-knowledge

# Milvus 配置
milvus:
  host: localhost
  port: 19530
  collection-name: knowledge_base

# Embedding 配置（统一使用 common.embedding.provider SPI）
embedding:
  provider: ${EMBEDDING_PROVIDER:dashscope}
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
    model: text-embedding-v3