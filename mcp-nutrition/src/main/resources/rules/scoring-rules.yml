# ============================================================
# 通用营养评分规则配置
# ============================================================
# 替代 RecipeEvaluator.java (266 行 Java 算法)
# 由 ScoringEngine 在启动时加载执行
#
# 评分流程：
#   1. 根据 crowdType 查找对应人群的营养标准
#   2. 根据 schoolType + mealPrice 计算宽松度
#   3. 对每个维度(热量/蛋白质/脂肪/碳水/多样性)独立评分
#   4. 加权汇总 → 查等级表 → 输出结果
# ============================================================

scoring:
  # 评分方案名称
  name: "学校营养餐评分标准 v3.0"

  # ==========================================================
  # 评分维度权重（五项合计 = 1.0）
  # ==========================================================
  weights:
    calorie: 0.30     # 能量供给 30%
    protein: 0.25     # 宏量营养素（蛋白质）25%
    fat: 0.15         # 脂肪 15%
    carbs: 0.15       # 碳水化合物 15%
    variety: 0.15     # 食材多样性 15%

  # ==========================================================
  # 宽松度配置
  # ==========================================================
  tolerances:
    # 学校类型宽松度（值越大要求越宽松）
    school-type:
      优质城市: 1.10
      普通城市: 1.20
      农村: 1.35

    # 餐费价格区间宽松度 [最低价, 最高价, 宽松度]
    price-tiers:
      - [0, 5, 1.30]       # 0-5元，极大宽松
      - [5, 8, 1.20]       # 5-8元，较大宽松
      - [8, 12, 1.10]      # 8-12元，中等宽松
      - [12, 999999, 1.0]  # 12元以上，标准

  # ==========================================================
  # 各人群每日营养标准
  # 格式: [最小值, 最大值]
  # 热量: kcal | 蛋白质: g | 脂肪: g | 碳水: g
  # ==========================================================
  standards:
    - crowd: "学龄前"
      keywords: ["学龄前", "3-6"]
      calorie: [1000, 1200]
      protein: [30, 35]
      fat: [33, 40]
      carbs: [150, 180]

    - crowd: "小学低年级"
      keywords: ["小学低", "6-9", "1-3年级"]
      calorie: [1200, 1500]
      protein: [35, 45]
      fat: [40, 50]
      carbs: [180, 220]

    - crowd: "小学高年级"
      keywords: ["小学高", "10-12", "4-6年级"]
      calorie: [1500, 1800]
      protein: [45, 55]
      fat: [50, 60]
      carbs: [220, 270]

    - crowd: "初中生"
      keywords: ["初中", "13-15"]
      calorie: [2000, 2400]
      protein: [55, 70]
      fat: [60, 75]
      carbs: [300, 360]

    - crowd: "高中生"
      keywords: ["高中", "16-18"]
      calorie: [2200, 2600]
      protein: [65, 80]
      fat: [70, 85]
      carbs: [330, 400]

    - crowd: "教师/默认"
      keywords: ["教师", "成人", "默认"]
      calorie: [1800, 2200]
      protein: [50, 65]
      fat: [50, 65]
      carbs: [250, 320]

  # ==========================================================
  # 等级阈值（分数 ≥ 阈值 → 对应等级）
  # ==========================================================
  grades:
    A: 90      # 优秀
    B: 80      # 良好
    C: 70      # 中等
    D: 60      # 及格