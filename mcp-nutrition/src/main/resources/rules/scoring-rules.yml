# ============================================================
# 通用营养评分规则配置
# ============================================================
# 替代 RecipeEvaluator.java (266 行 Java 算法)
# 由 ScoringEngine 在启动时加载执行
#
# 评分流程：
#   1. 根据 crowdType 查找对应人群的营养标准
#   2. 根据 schoolType + mealPrice 计算宽松度
#   3. 对每个维度(热量/蛋白质/脂肪/碳水/多样性)独立评分
#   4. 加权汇总 → 查等级表 → 输出结果
# ============================================================

scoring:
  # 评分方案名称
  name: "学校营养餐评分标准 v3.0"

  # ==========================================================
  # 评分维度权重（五项合计 = 1.0）
  # ==========================================================
  weights:
    calorie: 0.30     # 能量供给 30%
    protein: 0.25     # 宏量营养素（蛋白质）25%
    fat: 0.15         # 脂肪 15%
    carbs: 0.15       # 碳水化合物 15%
    variety: 0.15     # 食材多样性 15%
    # 微量元素 / 维生素（占总分权重，合计建议 ≤ 0.30）
    # 评分算法与宏量不同：按 实际摄入 / 每日推荐摄入量 的达标率计分，并非区间匹配
    micro: 0.15       # 微量元素综合 15%

  # ==========================================================
  # 微量元素分项权重（micro 0.15 的内部拆解，合计 = 1.0）
  # 评分算法与宏量不同：按 实际摄入 / 每日推荐摄入量 的达标率计分，并非区间匹配
  # 注意：本段为 scoring 顶级键，不能塞进 weights（否则解析时 LinkedHashMap 无法强转 Number）
  # ==========================================================
  micro_items:
    calcium: 0.18   # 钙(mg)
    iron:   0.16    # 铁(mg)
    zinc:   0.14    # 锌(mg)
    vitA:   0.18    # 维生素A(μg RE)
    vitB1:  0.17    # 维生素B1(mg)
    vitB2:  0.17    # 维生素B2(mg)

  # ==========================================================
  # 微量元素每日推荐摄入量（校园口径，默认；参考中国居民膳食指南 DRIs 成人均值）
  # 单位：calcium/iron/zinc=mg，vitA=μg RE，vitB1/vitB2/vitC=mg
  # 评分 = min(100, 实际摄入 / 推荐量 * 100)
  # 校园餐默认采用成人均值；居民人群由下方 micro-rda-resident 按人群覆盖。
  # ==========================================================
  micro-rda:
    calcium: 800      # 钙 800mg
    iron:   12        # 铁 12mg（成人男；育龄女见 resident）
    zinc:   12.5      # 锌 12.5mg
    vitA:   800       # 维生素A 800μg RE
    vitB1:  1.4       # 维生素B1 1.4mg
    vitB2:  1.4       # 维生素B2 1.4mg
    vitC:   100       # 维生素C 100mg

  # ==========================================================
  # 居民人群微量元素每日推荐摄入量（覆盖页面 5 类人群）
  # 参考《中国居民膳食营养素参考摄入量（2023版）》DRIs / 中国营养学会
  # 单位同 micro-rda。引擎按 crowdType 关键词匹配：命中则用此表，否则用上方默认 micro-rda。
  # 数值要点：
  #  - 老人(65+)钙 1000mg、铁 12mg、锌 12.5mg（2023版提高老年蛋白质，钙较成人升）
  #  - 孕产：孕中晚钙 1000mg、铁 24mg、锌 9.5mg、维A 770μgRE；乳母钙 1000mg、铁 24mg、锌 12mg、维A 1300μgRE、维C 150mg
  #  - 成人/儿童沿用成人/学龄均值（儿童取学龄段下限近似）
  # ==========================================================
  micro-rda-resident:
    儿童:  { calcium: 800, iron: 12,   zinc: 12.5, vitA: 800,  vitB1: 1.4, vitB2: 1.4, vitC: 90  }
    成人:  { calcium: 800, iron: 12,   zinc: 12.5, vitA: 800,  vitB1: 1.4, vitB2: 1.4, vitC: 100 }
    老人:  { calcium: 1000, iron: 12,  zinc: 12.5, vitA: 800,  vitB1: 1.4, vitB2: 1.4, vitC: 100 }
    孕产:  { calcium: 1000, iron: 24,  zinc: 9.5,  vitA: 770,  vitB1: 1.4, vitB2: 1.4, vitC: 115 }
    慢病:  { calcium: 800, iron: 12,   zinc: 12.5, vitA: 800,  vitB1: 1.4, vitB2: 1.4, vitC: 100 }

  # ==========================================================
  # 宽松度配置
  # ==========================================================
  tolerances:
    # 学校类型宽松度（值越大要求越宽松）
    school-type:
      优质城市: 1.10
      普通城市: 1.20
      农村: 1.35

    # 餐费价格区间宽松度 [最低价, 最高价, 宽松度]
    price-tiers:
      - [0, 5, 1.30]       # 0-5元，极大宽松
      - [5, 8, 1.20]       # 5-8元，较大宽松
      - [8, 12, 1.10]      # 8-12元，中等宽松
      - [12, 999999, 1.0]  # 12元以上，标准

  # ==========================================================
  # 各人群每日营养标准
  # 格式: [最小值, 最大值]
  # 热量: kcal | 蛋白质: g | 脂肪: g | 碳水: g
  # ==========================================================
  standards:
    - crowd: "学龄前"
      keywords: ["学龄前", "3-6"]
      calorie: [1000, 1200]
      protein: [30, 35]
      fat: [33, 40]
      carbs: [150, 180]

    - crowd: "小学低年级"
      keywords: ["小学低", "6-9", "1-3年级"]
      calorie: [1200, 1500]
      protein: [35, 45]
      fat: [40, 50]
      carbs: [180, 220]

    - crowd: "小学高年级"
      keywords: ["小学高", "10-12", "4-6年级"]
      calorie: [1500, 1800]
      protein: [45, 55]
      fat: [50, 60]
      carbs: [220, 270]

    - crowd: "初中生"
      keywords: ["初中", "13-15"]
      calorie: [2000, 2400]
      protein: [55, 70]
      fat: [60, 75]
      carbs: [300, 360]

    - crowd: "高中生"
      keywords: ["高中", "16-18"]
      calorie: [2200, 2600]
      protein: [65, 80]
      fat: [70, 85]
      carbs: [330, 400]

    - crowd: "教师/默认"
      keywords: ["教师", "默认"]
      calorie: [1800, 2200]
      protein: [50, 65]
      fat: [50, 65]
      carbs: [250, 320]

  # ----------------------------------------------------------
  # 居民人群（页面 recipe-make 口径，覆盖 儿童/成人/老人/孕产/慢病）
  # 标准参考《中国居民膳食营养素参考摄入量（2023版）》DRIs / 中国营养学会
  # 单位同校园段；微量与 macro 区分见 micro-rda-resident
  # ----------------------------------------------------------
    - crowd: "儿童"
      keywords: ["儿童", "少儿", "4-17", "青少年"]
      calorie: [1600, 2000]
      protein: [40, 60]
      fat: [45, 70]
      carbs: [220, 300]

    - crowd: "成人"
      keywords: ["成人", "成年人", "18-64"]
      calorie: [1800, 2200]
      protein: [50, 65]
      fat: [50, 70]
      carbs: [250, 320]

    - crowd: "老人"
      keywords: ["老人", "老年", "65", "老龄"]
      calorie: [1600, 2000]
      protein: [55, 70]
      fat: [45, 65]
      carbs: [220, 290]

    - crowd: "孕产"
      keywords: ["孕产", "孕妇", "孕产妇", "乳母", "哺乳"]
      calorie: [2000, 2300]
      protein: [65, 85]
      fat: [55, 75]
      carbs: [260, 330]

    - crowd: "慢病"
      keywords: ["慢病", "慢病人群", "高血压", "糖尿病", "慢性"]
      calorie: [1600, 2000]
      protein: [55, 70]
      fat: [40, 60]
      carbs: [210, 280]

  # ==========================================================
  # 等级阈值（分数 ≥ 阈值 → 对应等级）
  # ==========================================================
  grades:
    A: 90      # 优秀
    B: 80      # 良好
    C: 70      # 中等
    D: 60      # 及格